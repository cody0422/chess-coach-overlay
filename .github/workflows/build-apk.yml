name: Build ChessCoachOverlay APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build Stockfish 19 for Android arm64-v8a (optional native engine)
        id: build_stockfish
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          NDK_DIR="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [ -z "$NDK_DIR" ] && [ -n "${ANDROID_HOME:-}" ] && [ -d "${ANDROID_HOME}/ndk" ]; then
            NDK_DIR=$(ls -d "${ANDROID_HOME}"/ndk/* 2>/dev/null | sort -V | tail -n 1 || true)
          fi
          if [ -z "$NDK_DIR" ] || [ ! -d "$NDK_DIR" ]; then
            echo "Android NDK not found; falling back to pure-Kotlin engine."
            exit 1
          fi
          CXX="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++"
          STRIP="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          if [ ! -x "$CXX" ]; then
            echo "NDK clang++ not found at $CXX; falling back to pure-Kotlin engine."
            exit 1
          fi

          rm -rf /tmp/Stockfish
          git clone --depth 1 --branch sf_19 https://github.com/official-stockfish/Stockfish.git /tmp/Stockfish

          cd /tmp/Stockfish/src
          make net

          SRCS=$(find . -name '*.cpp' ! -path './test*' ! -path './universal*' | tr '\n' ' ')
          echo "Compiling Stockfish 19 sources with $CXX..."
          "$CXX" -O3 -std=c++17 -DNDEBUG -DUSE_NEON=8 -DUSE_POPCNT -DIS_64BIT -fPIE -pie \
            -fno-exceptions -pthread -static-libstdc++ \
            -I. $SRCS -lm -o libstockfish.so

          if [ -x "$STRIP" ]; then
            "$STRIP" --strip-unneeded libstockfish.so || true
          fi

          FILE_INFO=$(file libstockfish.so)
          echo "Built binary info: $FILE_INFO"
          echo "$FILE_INFO" | grep -qi "ARM aarch64"

          mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          cp libstockfish.so "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libstockfish.so"
          ls -lh "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libstockfish.so"

      - name: Run Unit Tests and Assemble Debug APK
        run: |
          gradle testDebugUnitTest assembleDebug --no-daemon --stacktrace

      - name: Prepare ChessCoachOverlay.apk
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ChessCoachOverlay.apk
          ls -lh ChessCoachOverlay.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChessCoachOverlay-APK
          path: ChessCoachOverlay.apk
          retention-days: 90

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.3.0
          name: ChessCoachOverlay v2.3.0
          body: |
            ## ChessCoachOverlay v2.3.0
            - **Upgraded to Stockfish 19 (ARM64 NNUE):** Compiled directly from official `sf_19` with embedded NNUE network + pure-Kotlin fallback, adjustable **400–4000 Elo**, **50%–100% Accuracy**, **Depth 1–8**, and **∞ Unlimited Moves/Day**
            - **Crisp Slim Black Best-Move Arrow:** Sleek black vector arrow (`#E60B0F14` with subtle crisp `#CCF8FAFC` outer outline) matching clean slim proportions that pops razor-sharp on both dark and light themes — with built-in arrow-corridor self-masking so auto-read never misreads the arrow as a piece
            - **Fixed Pill Play/Pause Button:** Shows crisp white `||` while running (tap to pause) and muted grey `▶` while paused (tap to resume), with instant ON/PAUSED toast feedback
            - **Textured Ocean Theme & Automatic White/Black Detection:** Tightened inner-square piece sampling (`0.25..0.75`) and theme-adaptive foreground thresholds for 64/64 clean classification on Ocean/wave/textured Chess.com themes, plus automatic White/Black orientation detection without ever needing to tap Flip
            - **Smarter Telemetry & Auto-Hide Re-Detect:** Preserves pre-Settings scan telemetry while Settings is open, detects blank frames (`frameMaxLum < 12`), and auto-hides Settings on **Re-Detect** for instant board lock
          files: |
            ChessCoachOverlay.apk
          make_latest: true
