name: Build ChessCoachOverlay APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build Stockfish 19 for Android arm64-v8a (optional native engine)
        id: build_stockfish
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          NDK_DIR="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [ -z "$NDK_DIR" ] && [ -n "${ANDROID_HOME:-}" ] && [ -d "${ANDROID_HOME}/ndk" ]; then
            NDK_DIR=$(ls -d "${ANDROID_HOME}"/ndk/* 2>/dev/null | sort -V | tail -n 1 || true)
          fi
          if [ -z "$NDK_DIR" ] || [ ! -d "$NDK_DIR" ]; then
            echo "Android NDK not found; falling back to pure-Kotlin engine."
            exit 1
          fi
          CXX="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++"
          STRIP="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          if [ ! -x "$CXX" ]; then
            echo "NDK clang++ not found at $CXX; falling back to pure-Kotlin engine."
            exit 1
          fi

          rm -rf /tmp/Stockfish
          git clone --depth 1 --branch sf_19 https://github.com/official-stockfish/Stockfish.git /tmp/Stockfish

          cd /tmp/Stockfish/src
          make net

          SRCS=$(find . -name '*.cpp' ! -path './test*' ! -path './universal*' | tr '\n' ' ')
          echo "Compiling Stockfish 19 sources with $CXX..."
          "$CXX" -O3 -std=c++17 -DNDEBUG -DUSE_NEON=8 -DUSE_POPCNT -DIS_64BIT -fPIE -pie \
            -fno-exceptions -pthread -static-libstdc++ \
            -I. $SRCS -lm -o libstockfish.so

          if [ -x "$STRIP" ]; then
            "$STRIP" --strip-unneeded libstockfish.so || true
          fi

          FILE_INFO=$(file libstockfish.so)
          echo "Built binary info: $FILE_INFO"
          echo "$FILE_INFO" | grep -qi "ARM aarch64"

          mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          cp libstockfish.so "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libstockfish.so"
          ls -lh "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libstockfish.so"

      - name: Run Unit Tests and Assemble Debug APK
        run: |
          gradle testDebugUnitTest assembleDebug --no-daemon --stacktrace

      - name: Prepare ChessCoachOverlay.apk
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ChessCoachOverlay.apk
          ls -lh ChessCoachOverlay.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChessCoachOverlay-APK
          path: ChessCoachOverlay.apk
          retention-days: 90

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.5.0
          name: ChessCoachOverlay v2.5.0
          body: |
            ## ChessCoachOverlay v2.5.0
            - **Fixed Move-1 Arrow-Mask Desync (Multi-Move Bulletproof Tracking):** Upgraded `BoardVisionAnalyzer` arrow masking to be pixel-color-aware + slim-corridor so the drawn black arrow never erases your own moved piece sitting under the arrowhead (works for both White and Black pieces on Classic Green, Ocean, and Wood themes)
            - **Bulletproof Move Matching + Fast 3-Ply Bullet Catch-Up:** Fixed the `currentScore == 63` early-exit stall, added unique second-best verification, added changed-square-pruned 3-ply recovery (<2ms) for rapid multi-move bursts, and expanded local corner-highlight tolerance for Chess.com `#BACA2B` / `#F6F669` yellow last-move highlights
            - **Continuous 1.1s No-Red-Box Heartbeat + Slide-Safe Settle:** Kept locked Accessibility heartbeat at 1.1s (never stalls when opponent moves without Accessibility events), tuned post-event settle to 160ms so 2-square pawn slides finish landing before single-frame capture, and hardened Stockfish 19 UCI `stop`/`isready` synchronization
            - **Full Multi-Move Automated Test Suite:** Verified 4-move live games under active black arrows + Chess.com yellow highlights (White & Black orientations), `63 -> 64/64` transitions, and 3-ply bullet catch-up
            - **Official Stockfish 19 (`sf_19` ARM64 NNUE):** Built-in offline engine with live-streaming <0.3s first arrow, smooth 60fps black arrow animation, `My Turn Only` (your pieces only), and No-Red-Box Accessibility mode
          files: |
            ChessCoachOverlay.apk
          make_latest: true
